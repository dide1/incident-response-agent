[package]
name = "log-analyzer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "log-analyzer"
path = "src/main.rs"

[lib]
name = "log_analyzer"
path = "src/lib.rs"

[[bin]]
name = "bench-concurrent"
path = "src/bench.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
